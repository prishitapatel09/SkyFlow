apiVersion: v1
kind: Namespace
metadata:
  name: skyflow
  labels:
    name: skyflow
    app.kubernetes.io/part-of: skyflow
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: skyflow-quota
  namespace: skyflow
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    pods: "40"
    services: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: skyflow-limits
  namespace: skyflow
spec:
  limits:
    # A JVM needs more headroom than the Node processes this replaced, so the floor is higher.
    - type: Container
      default:
        cpu: 500m
        memory: 768Mi
      defaultRequest:
        cpu: 200m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 128Mi
