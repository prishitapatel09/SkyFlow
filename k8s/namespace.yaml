apiVersion: v1
kind: Namespace
metadata:
  name: skyflow
  labels:
    name: skyflow
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: skyflow-quota
  namespace: skyflow
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: skyflow-limits
  namespace: skyflow
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    type: Container
  - max:
      cpu: 2
      memory: 2Gi
    min:
      cpu: 100m
      memory: 128Mi
    type: Container
