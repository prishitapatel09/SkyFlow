apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyflow-ingress
  namespace: skyflow
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-port: "3000"
    alb.ingress.kubernetes.io/healthcheck-protocol: "HTTP"
    alb.ingress.kubernetes.io/success-codes: "200,302"
    alb.ingress.kubernetes.io/group.name: "skyflow"
    alb.ingress.kubernetes.io/group.order: "1"
    alb.ingress.kubernetes.io/load-balancer-attributes: "idle_timeout.timeout_seconds=60"
    alb.ingress.kubernetes.io/backend-protocol-version: "HTTP2"
    alb.ingress.kubernetes.io/security-groups: "${ALB_SECURITY_GROUP}"
    external-dns.alpha.kubernetes.io/hostname: "skyflow.example.com, api.skyflow.example.com"
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  rules:
  - host: skyflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skyflow-frontend-service
            port:
              number: 80
  - host: api.skyflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skyflow-backend-service
            port:
              number: 80
---
