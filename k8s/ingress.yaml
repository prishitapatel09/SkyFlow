# Single host: nginx inside the frontend pods proxies /api to the gateway, so the browser talks to
# one origin and there is no CORS preflight on the hot path.
#
# The Stripe webhook is the exception - it is called by Stripe, not by a browser, so it gets its
# own host routed straight at the gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyflow
  namespace: skyflow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180
    alb.ingress.kubernetes.io/group.name: skyflow
    external-dns.alpha.kubernetes.io/hostname: "skyflow.example.com,api.skyflow.example.com"
spec:
  ingressClassName: alb
  rules:
    - host: skyflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    - host: api.skyflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
