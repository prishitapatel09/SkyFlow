apiVersion: v1
kind: Secret
metadata:
  name: skyflow-secrets
  namespace: skyflow
type: Opaque
data:
  # Database credentials
  db-host: ${DB_HOST_B64}
  db-user: ${DB_USER_B64}
  db-password: ${DB_PASSWORD_B64}
  
  # MongoDB
  mongodb-url: ${MONGODB_URL_B64}
  
  # Redis
  redis-url: ${REDIS_URL_B64}
  
  # RabbitMQ
  rabbitmq-url: ${RABBITMQ_URL_B64}
  
  # JWT
  jwt-secret: ${JWT_SECRET_B64}
  
  # Stripe
  stripe-secret-key: ${STRIPE_SECRET_KEY_B64}
  stripe-publishable-key: ${STRIPE_PUBLISHABLE_KEY_B64}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET_B64}
  
  # Email
  email-user: ${EMAIL_USER_B64}
  email-password: ${EMAIL_PASSWORD_B64}
---
apiVersion: v1
kind: Secret
metadata:
  name: ecr-secret
  namespace: skyflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${ECR_DOCKER_CONFIG_B64}
