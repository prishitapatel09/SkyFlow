# Placeholders are substituted by deploy.sh from the environment. Never commit real values -
# in a live cluster these come from External Secrets or the AWS Secrets Store CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: skyflow-secrets
  namespace: skyflow
type: Opaque
data:
  # jdbc:postgresql://<rds-endpoint>:5432/skyflow
  db-url: ${DB_URL_B64}
  db-user: ${DB_USER_B64}
  db-password: ${DB_PASSWORD_B64}

  redis-host: ${REDIS_HOST_B64}
  redis-password: ${REDIS_PASSWORD_B64}

  rabbitmq-host: ${RABBITMQ_HOST_B64}
  rabbitmq-user: ${RABBITMQ_USER_B64}
  rabbitmq-password: ${RABBITMQ_PASSWORD_B64}

  # Shared by user-service (signing) and api-gateway (verifying); must be at least 32 bytes.
  jwt-secret: ${JWT_SECRET_B64}

  stripe-secret-key: ${STRIPE_SECRET_KEY_B64}
  stripe-publishable-key: ${STRIPE_PUBLISHABLE_KEY_B64}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET_B64}

  anthropic-api-key: ${ANTHROPIC_API_KEY_B64}

  email-user: ${EMAIL_USER_B64}
  email-password: ${EMAIL_PASSWORD_B64}
---
apiVersion: v1
kind: Secret
metadata:
  name: ecr-secret
  namespace: skyflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${ECR_DOCKER_CONFIG_B64}
