apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyflow-frontend
  namespace: skyflow
  labels:
    app: skyflow-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skyflow-frontend
  template:
    metadata:
      labels:
        app: skyflow-frontend
        version: v1
    spec:
      containers:
      - name: skyflow-frontend
        image: ${ECR_REGISTRY}/skyflow-frontend:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "https://api.skyflow.example.com"
        - name: VITE_STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: skyflow-secrets
              key: stripe-publishable-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      imagePullSecrets:
      - name: ecr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: skyflow-frontend-service
  namespace: skyflow
  labels:
    app: skyflow-frontend
spec:
  selector:
    app: skyflow-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skyflow-frontend-hpa
  namespace: skyflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skyflow-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
