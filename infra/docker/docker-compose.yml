# Full stack for local development.
#
#   ./start-dev.sh
#
# or directly, from the repository root:
#
#   docker compose -f infra/docker/docker-compose.yml --project-directory . up --build
#
# --project-directory pins relative paths to the repository root, so the build contexts and the
# monitoring mounts below stay root-relative even though this file does not live there.
#
# Frontend  http://localhost:3001   (nginx, proxies /api to the gateway)
# Gateway   http://localhost:8080
# RabbitMQ  http://localhost:15672  (guest / guest)
# Grafana   http://localhost:3000   (admin / admin)
#
# The booking service runs as a single-replica cluster here. To watch the leader election and
# task failover, add the three-replica override:
#
#   ./start-dev.sh cluster

x-java-env: &java-env
  DB_URL: jdbc:postgresql://postgres:5432/skyflow
  DB_USER: postgres
  DB_PASSWORD: password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-service-urls: &service-urls
  USER_SERVICE_URL: http://user-service:8086
  FLIGHT_SERVICE_URL: http://flight-service:8081
  BOOKING_SERVICE_URL: http://booking-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
  AI_SERVICE_URL: http://ai-service:8085

x-healthcheck: &java-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/actuator/health/readiness || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 45s

x-depends-on-infra: &depends-on-infra
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ------------------------------------------------------------------ infrastructure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skyflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ------------------------------------------------------------------ services

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: api-gateway
    environment:
      <<: [*java-env, *service-urls]
      PORT: "8080"
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: *java-healthcheck

  user-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: user-service
    environment:
      <<: *java-env
      PORT: "8086"
    depends_on: *depends-on-infra
    healthcheck: *java-healthcheck

  flight-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: flight-service
    environment:
      <<: *java-env
      PORT: "8081"
    depends_on: *depends-on-infra
    healthcheck: *java-healthcheck

  booking-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: booking-service
    environment:
      <<: [*java-env, *service-urls]
      PORT: "8082"
      # Single-replica cluster: quorum is 1, so this node elects itself immediately.
      CLUSTER_ENABLED: "true"
      CLUSTER_ADVERTISED_HOST: booking-service
      CLUSTER_GRPC_PORT: "9090"
      CLUSTER_PEERS: ""
    depends_on: *depends-on-infra
    healthcheck: *java-healthcheck

  payment-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: payment-service
    environment:
      <<: *java-env
      PORT: "8083"
      # Without a key the service still starts; payment calls fail with Stripe's own error.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
    depends_on: *depends-on-infra
    healthcheck: *java-healthcheck

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: notification-service
    environment:
      <<: *java-env
      PORT: "8084"
      # Off by default locally: emails are rendered and recorded, never sent.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@skyflow.local}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
    depends_on: *depends-on-infra
    healthcheck: *java-healthcheck

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: ai-service
    environment:
      <<: [*java-env, *service-urls]
      PORT: "8085"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: *java-healthcheck

  frontend:
    build:
      context: ./frontend
    environment:
      GATEWAY_HOST: api-gateway:8080
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_started

  # ------------------------------------------------------------------ monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=72h
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
