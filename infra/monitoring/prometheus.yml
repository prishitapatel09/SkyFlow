global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: skyflow

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Every Spring Boot service exposes Micrometer metrics on the same path.
  - job_name: skyflow-services
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api-gateway:8080']
        labels: { service: api-gateway }
      - targets: ['user-service:8086']
        labels: { service: user-service }
      - targets: ['flight-service:8081']
        labels: { service: flight-service }
      - targets: ['booking-service:8082']
        labels: { service: booking-service }
      - targets: ['payment-service:8083']
        labels: { service: payment-service }
      - targets: ['notification-service:8084']
        labels: { service: notification-service }
      - targets: ['ai-service:8085']
        labels: { service: ai-service }

  # In Kubernetes the static list above is replaced by pod discovery: every service's pod template
  # carries the prometheus.io/scrape annotations this job reads.
  - job_name: skyflow-kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [skyflow]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
