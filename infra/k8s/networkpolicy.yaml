# The identity headers the gateway injects are only trustworthy if nothing else can reach the
# services directly. These policies are what make that true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: skyflow
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-ingress
  namespace: skyflow
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress-and-frontend
  namespace: skyflow
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-gateway-only
  namespace: skyflow
spec:
  # Every HTTP service behind the edge. Only the gateway, the AI service (which calls flight and
  # booking on the traveller's behalf), and booking-service (which calls flight and payment) may
  # reach them.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - flight-service
          - booking-service
          - payment-service
          - notification-service
          - ai-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: ai-service
        - podSelector:
            matchLabels:
              app: booking-service
    # Prometheus scrapes /actuator/prometheus on every pod.
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-coordination-grpc
  namespace: skyflow
spec:
  # The coordination plane is plaintext gRPC, so it must only be reachable from sibling replicas.
  podSelector:
    matchLabels:
      app: booking-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: booking-service
      ports:
        - port: 9090
          protocol: TCP
