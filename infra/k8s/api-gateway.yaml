apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skyflow
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: skyflow
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Spring Boot needs time to drain in-flight requests; the app is configured for graceful
      # shutdown, so give it room before SIGKILL.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api-gateway
          image: ${ECR_REGISTRY}/skyflow-api-gateway:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: LOG_LEVEL }
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef: { name: skyflow-secrets, key: redis-host }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: skyflow-secrets, key: redis-password }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: skyflow-secrets, key: jwt-secret }
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: CORS_ORIGINS }
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: USER_SERVICE_URL }
            - name: FLIGHT_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: FLIGHT_SERVICE_URL }
            - name: BOOKING_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: BOOKING_SERVICE_URL }
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: PAYMENT_SERVICE_URL }
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: NOTIFICATION_SERVICE_URL }
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: skyflow-config, key: AI_SERVICE_URL }
          resources:
            requests:
              cpu: "300m"
              memory: "640Mi"
            limits:
              memory: "1Gi"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: ecr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skyflow
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: skyflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: skyflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
