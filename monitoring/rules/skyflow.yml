groups:
  - name: skyflow-availability
    rules:
      - alert: ServiceDown
        expr: up{job="skyflow-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has been unreachable for 2 minutes"

      - alert: HighServerErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is returning over 5% 5xx responses"

  - name: skyflow-search-cache
    rules:
      # The cache is the reason search is fast; a collapsed hit ratio means Postgres is now
      # serving the hot path.
      - alert: FlightSearchCacheHitRatioLow
        expr: |
          sum(rate(cache_gets_total{cache="flightSearch",result="hit"}[10m]))
            / clamp_min(sum(rate(cache_gets_total{cache="flightSearch"}[10m])), 0.001) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Flight search cache hit ratio under 50%"

      - alert: FlightSearchLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri="/api/v1/flights/search"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Flight search p95 latency above 500ms"

  - name: skyflow-messaging
    rules:
      - alert: NotificationDeadLetterQueueGrowing
        expr: increase(rabbitmq_queue_messages{queue="skyflow.notifications.dlq"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Emails are being dead-lettered"
