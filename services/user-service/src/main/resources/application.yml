server:
  port: ${PORT:8086}
  shutdown: graceful

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skyflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Flyway owns the users schema; Hibernate has to resolve entities against
        # the same one rather than the connection's default (public).
        default_schema: users

  flyway:
    enabled: true
    schemas: users
    default-schema: users
    create-schemas: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

skyflow:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32b}
    expires-in: ${JWT_EXPIRES_IN:24h}
    refresh-expires-in: ${JWT_REFRESH_EXPIRES_IN:30d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.skyflow: ${LOG_LEVEL:INFO}
