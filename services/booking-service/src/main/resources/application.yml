server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skyflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Flyway owns the booking schema; Hibernate has to resolve entities against
        # the same one rather than the connection's default (public).
        default_schema: booking
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    schemas: booking
    default-schema: booking
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 8
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

skyflow:
  services:
    flight: ${FLIGHT_SERVICE_URL:http://localhost:8081}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8083}

  booking:
    # How long unpaid seats stay held.
    hold-duration: ${BOOKING_HOLD_DURATION:15m}
    hold-sweep-interval: ${BOOKING_HOLD_SWEEP_INTERVAL:60s}
    reminder-sweep-interval: ${BOOKING_REMINDER_SWEEP_INTERVAL:15m}
    cache-warm-interval: ${BOOKING_CACHE_WARM_INTERVAL:10m}

  cluster:
    enabled: ${CLUSTER_ENABLED:true}
    # Set to $(POD_NAME).<headless service> in Kubernetes; defaults to HOSTNAME otherwise.
    advertised-host: ${CLUSTER_ADVERTISED_HOST:}
    grpc-port: ${CLUSTER_GRPC_PORT:9090}
    # Comma-separated host:port list covering every replica, this one included.
    peers: ${CLUSTER_PEERS:}
    heartbeat-interval: 500ms
    election-timeout-min: 1500ms
    election-timeout-max: 3000ms
    failure-threshold: 3
    worker-capacity: ${CLUSTER_WORKER_CAPACITY:4}
    task-timeout: 60s
    max-task-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.skyflow: ${LOG_LEVEL:INFO}
