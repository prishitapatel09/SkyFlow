server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: flight-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skyflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Flyway owns the flight schema; Hibernate has to resolve entities against
        # the same one rather than the connection's default (public).
        default_schema: flight
        # Search results are mapped inside the transaction, so lazy airports would otherwise be
        # one query per flight. Batch fetching turns that into one query per page.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    schemas: flight
    default-schema: flight
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,caches
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.skyflow: ${LOG_LEVEL:INFO}
