<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${content.subject}">SkyFlow</title>
</head>
<body style="margin:0;padding:0;background:#f7fafc;font-family:'Helvetica Neue',Arial,sans-serif;color:#2d3748;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7fafc;padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.08);">
        <tr>
          <td style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:28px 32px;color:#ffffff;">
            <div style="font-size:20px;font-weight:700;letter-spacing:0.5px;">SkyFlow</div>
            <div style="font-size:24px;font-weight:700;margin-top:8px;" th:text="${content.heading}">Heading</div>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <p style="font-size:16px;line-height:1.6;margin:0 0 24px 0;" th:text="${content.intro}">Intro</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   th:if="${not #lists.isEmpty(content.details)}"
                   style="border-collapse:collapse;font-size:15px;">
              <tr th:each="detail : ${content.details}">
                <td style="padding:10px 0;border-bottom:1px solid #edf2f7;color:#718096;width:180px;"
                    th:text="${detail.label}">Label
                </td>
                <td style="padding:10px 0;border-bottom:1px solid #edf2f7;font-weight:600;"
                    th:text="${detail.value}">Value
                </td>
              </tr>
            </table>

            <p th:if="${content.footer != null}" style="font-size:14px;color:#718096;margin:24px 0 0 0;"
               th:text="${content.footer}">Footer</p>
          </td>
        </tr>
        <tr>
          <td style="background:#2d3748;padding:20px 32px;color:#a0aec0;font-size:12px;">
            You are receiving this because you booked with SkyFlow.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
