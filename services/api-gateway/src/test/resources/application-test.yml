# The routing table is what is under test; no Redis is reachable, so lazily connect and never
# ping it on startup.
spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          # The default rate-limit filter would need a live Redis; routes are asserted directly.
          default-filters: []
